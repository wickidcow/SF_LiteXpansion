name: Build LiteXpansion Legacy

on:
  push:
    branches:
      - main
      - master
      - 'agent/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  LEGACY_ARTIFACT_VERSION: "1.0.1"
  LEGACY_SLIMEFUN_VERSION: "4.1.29"
  LEGACY_SLIMEFUN_TAG: "SlimefunLegacy4.1.29B"
  SLIMEFUN_API_VERSION: "2025.1"

jobs:
  build:
    name: Paper 26.2 / Java 25 / Slimefun Legacy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify Legacy fork contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<paper.version>[26.2.build,)</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>25</maven.compiler.release>' pom.xml
          grep -Fq '<version>1.0.1-26.2-legacy</version>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
          grep -Fq 'depend: [Slimefun]' src/main/resources/plugin.yml
          grep -Fq 'nerf-other-addons: false' src/main/resources/config.yml
          grep -Fq 'auto-update: false' src/main/resources/config.yml
          grep -Fq 'StorageCacheUtils' src/main/java/dev/j3fftw/litexpansion/items/CargoConfigurator.java
          grep -Fq 'StorageCacheUtils' src/main/java/dev/j3fftw/litexpansion/items/GlassCutter.java
          grep -Fq 'StorageCacheUtils' src/main/java/dev/j3fftw/litexpansion/Events.java

          if test -f src/main/java/dev/j3fftw/litexpansion/GlowEnchant.java; then
            echo 'GlowEnchant must be removed for modern Paper.'
            exit 1
          fi

          echo 'Legacy fork contract passed.'

      - name: Install Slimefun Legacy compile runtime
        shell: bash
        run: |
          set -euo pipefail
          LEGACY_JAR="${RUNNER_TEMP}/Slimefun-${LEGACY_SLIMEFUN_VERSION}.jar"
          LEGACY_URL="https://github.com/wickidcow/Slimefun-Legacy/releases/download/${LEGACY_SLIMEFUN_TAG}/Slimefun-${LEGACY_SLIMEFUN_VERSION}.jar"

          curl --fail --location --retry 3 --silent --show-error \
            --output "$LEGACY_JAR" \
            "$LEGACY_URL"

          test -s "$LEGACY_JAR"
          jar tf "$LEGACY_JAR" | grep -Fq 'io/github/thebusybiscuit/slimefun4/api/SlimefunAddon.class'

          mvn -B install:install-file \
            -Dfile="$LEGACY_JAR" \
            -DgroupId=com.github.SlimefunGuguProject \
            -DartifactId=Slimefun4 \
            -Dversion="$SLIMEFUN_API_VERSION" \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build and verify against Slimefun Legacy
        run: mvn -B clean verify --file pom.xml

      - name: Stage direct versioned Legacy JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*')
          test "${#jars[@]}" -eq 1

          OUTPUT="dist/SF_LiteXpansion_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          cp "${jars[0]}" "$OUTPUT"
          test -s "$OUTPUT"
          sha256sum "$OUTPUT"

      - name: Upload direct versioned Legacy JAR
        uses: actions/upload-artifact@v7
        with:
          name: SF_LiteXpansion_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          path: dist/SF_LiteXpansion_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          archive: false
          if-no-files-found: error
          retention-days: 30
