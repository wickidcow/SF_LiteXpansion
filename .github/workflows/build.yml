name: Build LiteXpansion Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.1"
  LEGACY_SLIMEFUN_VERSION: "4.1.29"
  LEGACY_SLIMEFUN_TAG: "SlimefunLegacy4.1.29B"
  SLIMEFUN_API_VERSION: "2025.1"
  OUTPUT_NAME: "SF_LiteXpansion1.0.1.jar"

jobs:
  build:
    name: Paper 26.2 / Java 25 / Slimefun Legacy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install Slimefun Legacy compile runtime
        shell: bash
        run: |
          set -euo pipefail
          LEGACY_JAR="${RUNNER_TEMP}/Slimefun-${LEGACY_SLIMEFUN_VERSION}.jar"
          LEGACY_URL="https://github.com/wickidcow/Slimefun-Legacy/releases/download/${LEGACY_SLIMEFUN_TAG}/Slimefun-${LEGACY_SLIMEFUN_VERSION}.jar"
          curl --fail --location --retry 3 --silent --show-error --output "$LEGACY_JAR" "$LEGACY_URL"
          test -s "$LEGACY_JAR"
          mvn -B install:install-file -Dfile="$LEGACY_JAR" -DgroupId=com.github.SlimefunGuguProject -DartifactId=Slimefun4 -Dversion="$SLIMEFUN_API_VERSION" -Dpackaging=jar -DgeneratePom=true
      - name: Build and verify against Slimefun Legacy
        run: mvn -B clean verify --file pom.xml
      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$JAR" --clobber; else gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --generate-notes --title "SF_LiteXpansion $TAG"; fi
